<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 300; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes barGrow {
      0% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
      100% { transform: scaleY(0.2); }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    
    .bg-circle { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
    .floating-bg { animation: floatCard 6s ease-in-out infinite; }
    .chart-line { stroke-dasharray: 300; animation: dashMove 4s linear infinite; }
    .animated-bar { transform-box: fill-box; transform-origin: bottom; animation: barGrow 4s ease-in-out infinite; }
    .pulsing-node { animation: nodePulse 3s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGlow)"/>

  <!-- Dynamic Animated Background Graphic Elements (Deep Layer) -->
  <g opacity="0.25">
    <circle class="bg-circle" cx="150" cy="80" r="180" fill="#38bdf8"/>
    <circle class="bg-circle" cx="1050" cy="280" r="220" fill="#818cf8"/>
  </g>

  <!-- Background Decorative Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Animated Cloud FinOps Visual Elements (Right Side Decorative) -->
  <g class="floating-bg" transform="translate(820, 50)">
    <!-- Glassmorphic Card Container -->
    <rect x="0" y="0" width="320" height="220" rx="16" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.5))"/>
    
    <!-- Card Header / Badges -->
    <text x="25" y="40" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">CLOUD COST ANALYTICS</text>
    <rect x="230" y="25" width="65" height="22" rx="11" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
    <text x="242" y="40" fill="#4ade80" font-size="11" font-weight="700">-34.2%</text>

    <!-- Bar Chart Animation -->
    <g transform="translate(25, 170)">
      <rect class="animated-bar" x="0" y="-80" width="22" height="80" rx="4" fill="#38bdf8" opacity="0.8" style="animation-delay: 0s;"/>
      <rect class="animated-bar" x="35" y="-110" width="22" height="110" rx="4" fill="#818cf8" opacity="0.8" style="animation-delay: 0.4s;"/>
      <rect class="animated-bar" x="70" y="-60" width="22" height="60" rx="4" fill="#38bdf8" opacity="0.8" style="animation-delay: 0.8s;"/>
      <rect class="animated-bar" x="105" y="-130" width="22" height="130" rx="4" fill="#c084fc" opacity="0.8" style="animation-delay: 1.2s;"/>
      <rect class="animated-bar" x="140" y="-95" width="22" height="95" rx="4" fill="#38bdf8" opacity="0.8" style="animation-delay: 0.2s;"/>
      <rect class="animated-bar" x="175" y="-140" width="22" height="140" rx="4" fill="#4ade80" opacity="0.9" style="animation-delay: 0.6s;"/>
    </g>

    <!-- Overlay Trend Line -->
    <path class="chart-line" d="M 36 125 Q 85 80, 130 110 T 210 40" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Pulsing Nodes -->
    <circle class="pulsing-node" cx="36" cy="125" r="6" fill="#38bdf8"/>
    <circle class="pulsing-node" cx="130" cy="110" r="6" fill="#818cf8"/>
    <circle class="pulsing-node" cx="210" cy="40" r="6" fill="#4ade80"/>
  </g>

  <!-- Animated Floating Pill Badges -->
  <g class="floating-bg" transform="translate(70, 45)" style="animation-delay: -3s;">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="22" fill="#38bdf8" font-size="13" font-weight="600">☁️ Multi-Cloud</text>
  </g>

  <g class="floating-bg" transform="translate(230, 45)" style="animation-delay: -1.5s;">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="18" y="22" fill="#4ade80" font-size="13" font-weight="600">💰 FinOps 3.0</text>
  </g>

  <g class="floating-bg" transform="translate(375, 45)" style="animation-delay: -4.5s;">
    <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="18" y="22" fill="#c084fc" font-size="13" font-weight="600">⚡ Open-Source</text>
  </g>

  <!-- Main Title & Subtitle (Clear Foreground Layer) -->
  <g transform="translate(70, 145)">
    <!-- Main Title -->
    <text x="0" y="45" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
      Awesome Cloud Account Management
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="90" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Multi-Cloud Governance, FinOps Platforms &amp; Cost Optimization Ecosystem
    </text>

    <!-- Sub-features Bullet Tags -->
    <g transform="translate(0, 125)" font-size="13" font-weight="500" fill="#cbd5e1">
      <text x="0" y="0">✓ Enterprise SaaS Pricing</text>
      <text x="180" y="0">✓ Kubernetes Cost Allocation</text>
      <text x="410" y="0">✓ Star-Ranked Open-Source</text>
    </g>
  </g>

  <!-- Outer Decorative Accent Border -->
  <rect x="1" y="1" width="1198" height="358" rx="0" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)"/>
</svg>
